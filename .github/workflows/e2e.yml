name: E2E Tests (Playwright)

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  issue_comment:
    types: [created]

jobs:
  e2e:
    name: Run Playwright E2E tests
    # Se déclenche :
    # - automatiquement sur push vers main
    # - manuellement via l'onglet Actions
    # - depuis une PR en commentant "/e2e"
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '/e2e'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # Pour les commentaires de PR, on récupère le code de la PR.
          # Pour les autres événements, on utilise le ref par défaut.
          ref: ${{ github.event.issue.pull_request && format('refs/pull/{0}/head', github.event.issue.number) || '' }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run e2e

      - name: Publish Playwright test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          check_name: Playwright E2E Tests
          comment_title: Playwright E2E Tests
          files: test-results/junit.xml

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results
          retention-days: 14
